version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: eserian-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: newpassword123
      MYSQL_DATABASE: airbnb_clone
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    image: maven:3.9-eclipse-temurin-17
    container_name: eserian-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: airbnb_clone
      DB_USERNAME: root
      DB_PASSWORD: newpassword123
      JWT_SECRET: my-production-secret-key
    command: >
      sh -c "
      mvn dependency:go-offline -B &&
      mvn clean package -DskipTests &&
      java -jar target/*.jar
      "
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:18-alpine
    container_name: eserian-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    command: >
      sh -c "
      npm install &&
      npm start
      "
    depends_on:
      - backend

volumes:
  mysql-data: